server:
  port: 8080
  servlet:
    context-path: /ElderHub

spring:
  application:
    name: elder-hub
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：请把你本地数据库的密码修改到 password 这一行
    url: jdbc:mysql://localhost:3306/elderhub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      id-type: auto
      table-prefix: t_

jwt:
  secret: elderhub-jwt-secret-key-2024-please-change-me-32chars
  expiration-ms: 86400000